name: My First Workflow

on: [push]

jobs:
  first_jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Echo workflow message
        run: echo "My first GitHub Actions jobs"
      - name: List files
        run: ls -la
      - name: Display README
        run: cat README.md
